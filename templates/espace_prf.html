{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Professeur - Gestion Scolaire</title>
    <!-- Inclusion de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fichier CSS séparé -->
    <link rel="stylesheet" href="{% static 'css/espaces.css' %}">
</head>
<body>

    <!-- Barre latérale -->
    <div class="sidebar">
        <h3 class="text-center mb-4 fs-4">Espace Professeur</h3>
        <a href="#" class="active">Mes Enseignements</a>
        <a href="#">Saisir une Note</a>
        <a href="#">Marquer une Absence</a>
    </div>

    <!-- Contenu principal -->
   
    <div class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2>Portail Enseignant : {{ donnees.user.username }}</h2>
            <span class="badge bg-primary fs-6">Matière : {{ donnees.matiere }}</span>
        </header>
    
        <div class="row">
            <!-- Formulaire de Saisie de Note -->
            <div class="col-lg-6">
                <div class="custom-table-container">
                    <h4 class="mb-3">Saisir une Note (0 à 20)</h4>
                    
                    <!-- Formulaire Django lié au backend -->
                    <form action="{% url 'espace_etd' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="student" class="form-label">Sélectionner l'étudiant</label>
                            <select name="student_id" id="student" class="form-select" required>
                                <option value="">-- Choisir un étudiant --</option>
                                {% for i in stud %}
                                    <option value="{{i.id}}"> {{ i.nom }} {{ i.prenom }}  ({{ i.classe.name }})</option>
                                {% endfor %}
                            </select>
                        </div>

                          <div class="mb-3">
                            <label for="student" class="form-label">Sélectionner la Matiere</label>
                            <select name="student_id" id="student" class="form-select" required>
                                <option value="">-- Choisir la Matiere --</option>
                                {% for i in sub %}
                                    <option value="{{i.id}}"> {{ i.nom }} </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="grade" class="form-label">Note sur 20</label>
                            <input type="number" step="0.25" min="0" max="20" name="note" id="grade" class="form-control" placeholder="Ex: 14.5" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Enregistrer la note</button>
                    </form>
                </div>
            </div>

            <!-- Formulaire de Signalement d'Absence -->
            <div class="col-lg-6">
                <div class="custom-table-container">
                    <h4 class="mb-3">Signaler une Absence</h4>

                    <form action="" method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="student_abs" class="form-label">Sélectionner l'étudiant</label>
                            <select name="student_id" id="student_abs" class="form-select" required>
                                <option value="">-- Choisir un étudiant --</option>
                                {% for i in stud %}
                                    <option value="{{ i.id }}">{{ i.nom }} {{ i.prenom }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label">Date de l'absence</label>
                            <input type="date" name="date" id="date" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Statut justification</label>
                            <select name="status" id="status" class="form-select" required>
                                <option value="non justifiée">Non Justifiée</option>
                                <option value="justifiée">Justifiée</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 text-white">Enregistrer l'absence</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
